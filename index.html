<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍥 Ninja Mission Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- ===== FLOATING NINJA CHARACTERS ===== -->
    <div class="character-layer" id="characterLayer">
        <div class="ninja-run naruto">🍥</div>
        <div class="ninja-run sasuke">⚡</div>
        <div class="ninja-run sakura">🌸</div>
        <div class="ninja-run kakashi">🥷</div>
        <div class="ninja-run kurama">🦊</div>
        <div class="ninja-run toad">🐸</div>
        <div class="ninja-run snake">🐍</div>
        <div class="ninja-run scroll">📜</div>
        <div class="ninja-run shuriken">🌀</div>
        <div class="ninja-run kunai">🗡️</div>
    </div>

    <!-- ===== CHAKRA PARTICLES ===== -->
    <div class="chakra-particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- ===== RASENGAN LOADER ===== -->
    <div class="rasengan-loader" id="rasenganLoader">
        <div class="rasengan">
            <div class="rasengan-core"></div>
            <div class="rasengan-ring"></div>
            <div class="rasengan-ring r2"></div>
            <div class="rasengan-ring r3"></div>
        </div>
        <p class="loading-text">Loading Ninja Data...</p>
    </div>

    <div class="container" id="mainContainer" style="opacity:0;">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">
                <div class="konoha-symbol">
                    <img src="images/naruto-face.jpg" alt="Konoha" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
                </div>
                <div class="logo-text">
                    <h1>Ninja Mission Tracker</h1>
                    <span class="subtitle">疾風伝 • Weekly Training Log</span>
                </div>
            </div>
            <div class="header-buttons">
                <button class="icon-btn" id="darkModeBtn" onclick="toggleDarkMode()" title="Toggle Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="icon-btn logout-btn" onclick="logoutUser()" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- ===== WEEK NAVIGATION ===== -->
        <div class="week-nav">
            <button class="nav-btn" id="prevWeekBtn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="week-label-wrap">
                <span class="week-kanji">週</span>
                <span id="weekLabel">This Week</span>
            </div>
            <button class="nav-btn" id="nextWeekBtn">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button class="today-btn" id="todayBtn">
                <i class="fas fa-bolt"></i> Today
            </button>
        </div>

        <!-- ===== CHAKRA PROGRESS BAR ===== -->
        <div class="progress-section">
            <div class="progress-header">
                <span><i class="fas fa-fire"></i> Chakra Progress</span>
                <span id="progressPercent" class="chakra-percent">0%</span>
            </div>
            <div class="chakra-bar">
                <div class="chakra-fill" id="progressFill">
                    <div class="chakra-glow"></div>
                </div>
            </div>
            <div class="progress-rank" id="rankLabel">🥷 Genin</div>
        </div>

        <!-- ===== STATS ===== -->
        <div class="stats-grid">
            <div class="stat-card naruto-card">
                <div class="stat-icon">
                    <img src="images/naruto-face.jpg" alt="Naruto">
                </div>
                <div class="stat-info">
                    <span class="stat-label">Total Missions</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
            </div>
            <div class="stat-card sasuke-card">
                <div class="stat-icon">
                    <img src="images/sasuke-face.jpg" alt="Sasuke">
                </div>
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>
            <div class="stat-card sakura-card">
                <div class="stat-icon">
                    <img src="images/sakura-face.jpg" alt="Sakura">
                </div>
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="pendingTasks">0</span>
                </div>
            </div>
        </div>

        <!-- ===== ADD TASK ===== -->
        <div class="add-section">
            <div class="add-header">
                <h2><i class="fas fa-scroll"></i> New Mission</h2>
                <span class="hint">Press Enter to assign</span>
            </div>
            <div class="add-form">
                <input type="text" id="taskInput" placeholder="What's your mission, shinobi?" class="main-input">
                <button id="addBtn" class="add-btn">
                    <i class="fas fa-plus"></i> Assign
                </button>
            </div>
        </div>

        <!-- ===== WEEKLY TABLE ===== -->
        <div class="table-container">
            <table id="taskTable">
                <thead>
                    <tr>
                        <th class="task-col"><i class="fas fa-list"></i> Mission</th>
                        <th id="day1Header">Mon</th>
                        <th id="day2Header">Tue</th>
                        <th id="day3Header">Wed</th>
                        <th id="day4Header">Thu</th>
                        <th id="day5Header">Fri</th>
                        <th id="day6Header">Sat</th>
                        <th id="day7Header">Sun</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- Tasks appear here -->
                </tbody>
            </table>
        </div>

        <!-- ===== LEGEND ===== -->
        <div class="legend">
            <span class="legend-item">
                <img src="images/naruto-done.jpg" class="legend-img" alt=""> Completed
            </span>
            <span class="legend-item">
                <img src="images/failed.jpg" class="legend-img" alt=""> Failed
            </span>
            <span class="legend-item">
                <img src="images/kunai.jpg" class="legend-img" alt=""> Active
            </span>
            <span class="legend-item">
                <span class="legend-icon locked">🔒</span> Locked
            </span>
        </div>

        <!-- ===== BOTTOM ACTIONS ===== -->
        <div class="bottom-actions">
            <button class="export-btn" id="backupBtn">
                <i class="fas fa-download"></i> Save Scroll
            </button>
            <button class="clear-btn" id="clearBtn">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </div>
    </div>

    <!-- Firebase scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
