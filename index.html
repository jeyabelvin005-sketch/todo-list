<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Task Tracker Pro - Weekly View</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Rain Background -->
    <div class="rain-container">
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>Task Tracker Pro</h1>
            </div>
            <div class="header-actions">
                <button class="dark-mode-btn" id="darkModeBtn" onclick="toggleDarkMode()">
                    <i class="fas fa-moon"></i> Dark Mode
                </button>
                <div class="week-navigation">
                    <button class="nav-btn" id="prevWeek">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span class="week-label" id="weekLabel">This Week</span>
                    <button class="nav-btn" id="nextWeek">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <button class="today-btn" id="todayBtn">Today</button>
                </div>
            </div>
        </div>

        <!-- Progress Section -->
        <div class="progress-section">
            <div class="progress-header">
                <span><i class="fas fa-chart-line"></i> Weekly Progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card purple">
                <div class="stat-icon">
                    <i class="fas fa-tasks"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>
            <div class="stat-card orange">
                <div class="stat-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="pendingTasks">0</span>
                </div>
            </div>
        </div>

        <div class="quick-add-section">
            <div class="quick-add-header">
                <h2><i class="fas fa-plus-circle"></i> Quick Add Task</h2>
                <span class="hint">Press Enter to add quickly</span>
            </div>
            <div class="quick-add-form">
                <input type="text" id="taskInput" placeholder="Enter your task..." class="main-input">
                <button class="add-btn" id="addBtn">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
        </div>

        <!-- Weekly Table -->
        <div class="table-container">
            <table class="weekly-table">
                <thead>
                    <tr>
                        <th class="task-col"><i class="fas fa-list"></i> Tasks</th>
                        <th id="day1Header">Mon</th>
                        <th id="day2Header">Tue</th>
                        <th id="day3Header">Wed</th>
                        <th id="day4Header">Thu</th>
                        <th id="day5Header">Fri</th>
                        <th id="day6Header">Sat</th>
                        <th id="day7Header">Sun</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- Tasks will appear here -->
                </tbody>
            </table>
        </div>

        <div class="bottom-actions">
            <button class="export-btn" id="backupBtn">
                <i class="fas fa-download"></i> Backup Data
            </button>
            <button class="export-btn" id="restoreBtn">
                <i class="fas fa-upload"></i> Restore
            </button>
            <input type="file" id="restoreFile" accept=".json" style="display: none;">
            <button class="clear-btn" id="clearWeek">
                <i class="fas fa-trash-alt"></i> Clear Week
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
