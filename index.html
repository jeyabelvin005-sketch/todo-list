<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Weekly Task Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Rain Background -->
    <div class="rain-container">
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
        <div class="rain-drop"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <h1>Weekly Task Tracker</h1>
            </div>
            <button class="dark-mode-btn" id="darkModeBtn" onclick="toggleDarkMode()">
                <i class="fas fa-moon"></i> Dark Mode
            </button>
        </div>

        <!-- Week Navigation -->
        <div class="week-nav">
            <button class="nav-btn" id="prevWeekBtn">
                <i class="fas fa-chevron-left"></i> Prev
            </button>
            <span id="weekLabel">This Week</span>
            <button class="nav-btn" id="nextWeekBtn">
                Next <i class="fas fa-chevron-right"></i>
            </button>
            <button class="today-btn" id="todayBtn">
                <i class="fas fa-calendar-day"></i> Today
            </button>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-header">
                <span><i class="fas fa-chart-line"></i> Today's Progress</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card purple">
                <div class="stat-icon">
                    <i class="fas fa-tasks"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-icon">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Completed Today</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>
            <div class="stat-card orange">
                <div class="stat-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="stat-info">
                    <span class="stat-label">Pending Today</span>
                    <span class="stat-value" id="pendingTasks">0</span>
                </div>
            </div>
        </div>

        <!-- Add Task -->
        <div class="add-section">
            <div class="add-header">
                <h2><i class="fas fa-plus-circle"></i> Add New Task</h2>
                <span class="hint">Press Enter to add</span>
            </div>
            <div class="add-form">
                <input type="text" id="taskInput" placeholder="Enter task name..." class="main-input">
                <button id="addBtn" class="add-btn">
                    <i class="fas fa-plus"></i> Add Task
                </button>
            </div>
        </div>

        <!-- Weekly Table -->
        <div class="table-container">
            <table id="taskTable">
                <thead>
                    <tr>
                        <th class="task-col"><i class="fas fa-list"></i> Task</th>
                        <th id="day1Header">Mon</th>
                        <th id="day2Header">Tue</th>
                        <th id="day3Header">Wed</th>
                        <th id="day4Header">Thu</th>
                        <th id="day5Header">Fri</th>
                        <th id="day6Header">Sat</th>
                        <th id="day7Header">Sun</th>
                    </tr>
                </thead>
                <tbody id="taskTableBody">
                    <!-- Tasks will appear here -->
                </tbody>
            </table>
        </div>

        <!-- Legend -->
        <div class="legend">
            <span class="legend-item"><span class="legend-icon completed">✅</span> Completed</span>
            <span class="legend-item"><span class="legend-icon pending">❌</span> Not Completed</span>
            <span class="legend-item"><span class="legend-icon today">⬜</span> Today</span>
            <span class="legend-item"><span class="legend-icon locked">🔒</span> Future (Locked)</span>
        </div>

        <!-- Bottom Actions -->
        <div class="bottom-actions">
            <button class="export-btn" id="backupBtn">
                <i class="fas fa-download"></i> Backup
            </button>
            <button class="clear-btn" id="clearBtn">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
