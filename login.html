<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍥 Ninja Mission Tracker - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍥</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            background: rgba(20, 12, 6, 0.85);
            border: 2px solid rgba(255, 165, 0, 0.45);
            border-radius: 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(255, 107, 26, 0.2);
            padding: 40px 35px;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: containerEnter 1s ease-out;
        }

        body.dark-mode .login-container {
            background: rgba(10, 14, 26, 0.85);
            border-color: rgba(0, 217, 255, 0.4);
        }

        @keyframes containerEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo .konoha-symbol {
            width: 80px;
            height: 80px;
            margin: 0 auto 18px;
            font-size: 42px;
            border: 3px solid rgba(255, 165, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.3), rgba(45, 122, 62, 0.4));
            box-shadow: 0 0 25px rgba(45, 122, 62, 0.8);
            animation: leafPulse 3s ease-in-out infinite;
        }

        @keyframes leafPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(45, 122, 62, 0.8); }
            50%      { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 165, 0, 1); }
        }

        .login-logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #ff6b1a, #ffd700, #ff6b1a);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            animation: gradientShift 3s ease infinite;
            margin-bottom: 6px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% center; }
            50%      { background-position: 100% center; }
        }

        .login-logo .subtitle {
            color: rgba(255, 200, 100, 0.7);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .auth-tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(255, 165, 0, 0.25);
            gap: 5px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: rgba(255, 200, 100, 0.6);
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        .auth-tab.active {
            color: #ff6b1a;
            border-bottom-color: #ff6b1a;
            text-shadow: 0 0 10px rgba(255, 107, 26, 0.6);
        }

        .auth-tab:hover {
            color: #ffa500;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .auth-form input {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 14px;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 165, 0, 0.3);
            border-radius: 12px;
            font-size: 15px;
            color: #fff;
            font-family: inherit;
            transition: all 0.3s;
        }

        .auth-form input::placeholder {
            color: rgba(255, 200, 100, 0.5);
        }

        .auth-form input:focus {
            outline: none;
            border-color: #ff6b1a;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px rgba(255, 107, 26, 0.2), 0 0 25px rgba(255, 107, 26, 0.4);
        }

        .auth-form button[type="submit"] {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: linear-gradient(135deg, #ff6b1a, #e55000);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 5px 20px rgba(255, 107, 26, 0.5);
        }

        .auth-form button[type="submit"]:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 107, 26, 0.8);
        }

        .auth-form button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-error, .auth-success {
            font-size: 13px;
            margin-bottom: 12px;
            min-height: 18px;
            text-align: center;
            font-weight: 600;
        }

        .auth-error { color: #ff5555; text-shadow: 0 0 8px rgba(255, 85, 85, 0.5); }
        .auth-success { color: #55d6a1; text-shadow: 0 0 8px rgba(85, 214, 161, 0.5); }

        .login-quote {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 165, 0, 0.2);
            text-align: center;
        }

        .login-quote p {
            font-size: 13px;
            font-style: italic;
            color: rgba(255, 200, 100, 0.75);
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .login-quote .quote-source {
            font-size: 11px;
            color: #ffd700;
            letter-spacing: 2px;
            font-weight: 700;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @media (max-width: 550px) {
            .login-container { padding: 30px 22px; }
            .login-logo h1 { font-size: 20px; }
            .login-logo .konoha-symbol { width: 65px; height: 65px; font-size: 34px; }
        }
    </style>
</head>
<body>

    <!-- Floating Characters -->
    <div class="character-layer">
        <div class="ninja-run naruto">🍥</div>
        <div class="ninja-run sasuke">⚡</div>
        <div class="ninja-run sakura">🌸</div>
        <div class="ninja-run kakashi">🥷</div>
        <div class="ninja-run toad">🐸</div>
        <div class="ninja-run scroll">📜</div>
    </div>

    <!-- Chakra Particles -->
    <div class="chakra-particles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-logo">
            <div class="konoha-symbol">🍥</div>
            <h1>Ninja Mission Tracker</h1>
            <span class="subtitle">疾風伝 • Shinobi Login</span>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <button class="auth-tab" data-tab="signup">
                <i class="fas fa-user-plus"></i> Sign Up
            </button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form active">
            <div class="auth-error" id="loginError"></div>
            <input type="email" id="loginEmail" placeholder="📧 Email address" required autocomplete="email">
            <input type="password" id="loginPassword" placeholder="🔒 Password" required minlength="6" autocomplete="current-password">
            <button type="submit" id="loginBtn">
                <i class="fas fa-bolt"></i> Enter Konoha
            </button>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" class="auth-form">
            <div class="auth-error" id="signupError"></div>
            <div class="auth-success" id="signupSuccess"></div>
            <input type="email" id="signupEmail" placeholder="📧 Email address" required autocomplete="email">
            <input type="password" id="signupPassword" placeholder="🔒 Password (min 6 chars)" required minlength="6" autocomplete="new-password">
            <input type="password" id="signupConfirm" placeholder="🔒 Confirm password" required minlength="6" autocomplete="new-password">
            <button type="submit" id="signupBtn">
                <i class="fas fa-user-ninja"></i> Begin Your Journey
            </button>
        </form>

        <!-- Quote -->
        <div class="login-quote">
            <p>"Those who abandon their mission are trash, but those who abandon their comrades are worse than trash."</p>
            <span class="quote-source">— 🥷 Kakashi Hatake</span>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Tab Switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
                document.getElementById('loginError').textContent = '';
                document.getElementById('signupError').textContent = '';
                document.getElementById('signupSuccess').textContent = '';
            });
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');
            errEl.textContent = '';
            btn.disabled = true;
            try {
                await auth.signInWithEmailAndPassword(
                    document.getElementById('loginEmail').value.trim(),
                    document.getElementById('loginPassword').value
                );
                window.location.href = 'index.html';
            } catch (err) {
                errEl.textContent = friendlyError(err.code);
                btn.disabled = false;
            }
        });

        // Signup
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('signupError');
            const okEl = document.getElementById('signupSuccess');
            const btn = document.getElementById('signupBtn');
            errEl.textContent = '';
            okEl.textContent = '';
            const pwd = document.getElementById('signupPassword').value;
            const conf = document.getElementById('signupConfirm').value;
            if (pwd !== conf) { errEl.textContent = 'Passwords do not match!'; return; }
            btn.disabled = true;
            try {
                await auth.createUserWithEmailAndPassword(
                    document.getElementById('signupEmail').value.trim(),
                    pwd
                );
                okEl.textContent = '🍥 Welcome, shinobi! Entering Konoha...';
                setTimeout(() => window.location.href = 'index.html', 800);
            } catch (err) {
                errEl.textContent = friendlyError(err.code);
                btn.disabled = false;
            }
        });

        // Already logged in? Go to app
        auth.onAuthStateChanged(user => {
            if (user) window.location.href = 'index.html';
        });

        function friendlyError(code) {
            const map = {
                'auth/invalid-email': 'Invalid email address.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/email-already-in-use': 'This email is already registered.',
                'auth/weak-password': 'Password should be at least 6 characters.',
                'auth/too-many-requests': 'Too many attempts. Try again later.',
                'auth/network-request-failed': 'Network error. Check your connection.'
            };
            return map[code] || 'Something went wrong. Try again.';
        }
    </script>
</body>
</html>
